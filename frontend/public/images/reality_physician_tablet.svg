<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="60%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#DDD6FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.1" />
    </radialGradient>
    
    <!-- Coat Shadow Gradient -->
    <linearGradient id="coatShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Lapel Gradient -->
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Tablet Screen Gradient -->
    <linearGradient id="tabletScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A884" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Circle Backdrop -->
  <circle cx="210" cy="210" r="170" fill="url(#bgGlow)" />
  <circle cx="210" cy="210" r="140" fill="#EDE9FE" opacity="0.4" filter="url(#softGlow)" />

  <!-- Doctor Body / Torso -->
  <g transform="translate(10, 20)">
    <!-- Inner Dark Shirt / Tie Area -->
    <path d="M165 140 L210 140 L220 220 L155 220 Z" fill="#0F172A" opacity="0.9" />
    <!-- Tie / Collar Accent -->
    <polygon points="187,140 193,140 196,210 190,225 184,210" fill="#00A884" opacity="0.85" />
    <polygon points="175,140 188,140 185,160 172,145" fill="#E2E8F0" />
    <polygon points="205,140 192,140 195,160 208,145" fill="#CBD5E1" />

    <!-- Lab Coat Left Shoulder & Arm -->
    <path d="M90 340 L110 170 Q140 140 170 140 L188 240 L150 340 Z" fill="url(#coatShadow)" />
    <!-- Lab Coat Right Shoulder & Arm -->
    <path d="M290 340 L270 170 Q240 140 210 140 L192 240 L230 340 Z" fill="url(#coatShadow)" />

    <!-- Left Lapel -->
    <path d="M170 140 L135 240 L188 240 Z" fill="url(#lapelGrad)" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Right Lapel -->
    <path d="M210 140 L245 240 L192 240 Z" fill="url(#lapelGrad)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Stethoscope Around Neck -->
    <!-- Tubes -->
    <path d="M155 140 C150 175 160 215 178 240" fill="none" stroke="#334155" stroke-width="5.5" stroke-linecap="round" />
    <path d="M225 140 C230 175 220 215 202 240" fill="none" stroke="#334155" stroke-width="5.5" stroke-linecap="round" />
    <!-- Stethoscope Chest Piece -->
    <circle cx="190" cy="248" r="14" fill="#64748B" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="190" cy="248" r="8" fill="#00A884" opacity="0.9" />

    <!-- Digital Tablet Being Held -->
    <g transform="translate(115, 230) rotate(-6)">
      <!-- Tablet Body -->
      <rect x="0" y="0" width="165" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3" />
      <!-- Tablet Screen -->
      <rect x="8" y="8" width="149" height="104" rx="8" fill="url(#tabletScreen)" />

      <!-- Screen UI: Clinical Dashboard UI Elements -->
      <!-- Header bar -->
      <rect x="16" y="16" width="30" height="4" rx="2" fill="#64748B" opacity="0.6" />
      <circle cx="140" cy="18" r="3" fill="#00A884" />

      <!-- Patient Vitals EKG Pulse Waveform -->
      <path d="M16 48 L40 48 L46 38 L54 60 L62 30 L68 54 L74 48 L142 48" fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Mini Metric Bars -->
      <rect x="16" y="66" width="40" height="6" rx="3" fill="#00A884" opacity="0.75" />
      <rect x="62" y="66" width="32" height="6" rx="3" fill="#38BDF8" opacity="0.75" />
      <rect x="100" y="66" width="36" height="6" rx="3" fill="#A855F7" opacity="0.75" />

      <rect x="16" y="80" width="55" height="4" rx="2" fill="#475569" opacity="0.5" />
      <rect x="16" y="88" width="70" height="4" rx="2" fill="#334155" opacity="0.5" />

      <!-- Doctor Hands Holding Tablet -->
      <!-- Left thumb -->
      <rect x="-6" y="45" width="16" height="32" rx="8" fill="#F8D7BE" stroke="#E2B195" stroke-width="1.5" />
      <!-- Right thumb -->
      <rect x="155" y="45" width="16" height="32" rx="8" fill="#F8D7BE" stroke="#E2B195" stroke-width="1.5" />
    </g>
  </g>
</svg>
